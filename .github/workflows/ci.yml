name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up a modern Java Development Kit (JDK 17 is standard for modern Scala apps)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt' # Caches SBT dependencies between runs for faster builds

      # 3. Run your tests via SBT
      - name: Run Tests
        run: sbt test